<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuera de plano · Arturo</title>
<meta name="description" content="Esta página no existe. Vuelve al portfolio de Arturo, dirección de arte y concepto.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0A">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* 404 — Fuera de plano. Página autónoma: no depende de index.html ni de data.js. */
:root{
  --night:#0B0B0A; --screen:#F3F2EE; --dim:#8E8C86; --line:rgba(243,242,238,.22);
  --f-disp:"Anybody","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --mar:16px; --head:52px; --ease:cubic-bezier(.16,1,.3,1); --cut:cubic-bezier(.77,0,.18,1);
  color-scheme:dark;
}
@media (min-width:700px){:root{--mar:20px}}
@media (min-width:1100px){:root{--mar:24px;--head:56px}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--night);color:var(--screen);font-family:var(--f-mono);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
::selection{background:var(--screen);color:var(--night)}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.meta{font:400 .74rem/1.45 var(--f-mono);letter-spacing:.03em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--head);padding-inline:var(--mar)}
.logo{font:900 1.25rem/1 var(--f-disp);font-stretch:150%;letter-spacing:.01em;text-transform:uppercase}
.hd a.nav{font:750 .9rem/1 var(--f-disp);font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;padding:10px 0}
.bar{display:flex;justify-content:space-between;gap:16px;padding:8px var(--mar);border-block:1px solid var(--line)}
.bar span{white-space:nowrap}
.bar .tc{color:var(--dim)}
@media (max-width:440px){.bar .tc{display:none}}
main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(32px,6vw,72px) var(--mar) calc(var(--mar) + 8px);overflow-x:clip}
/* Cada línea llena el ancho cambiando la anchura (eje wdth), como la portada. */
.big{margin:0;font-family:var(--f-disp);font-weight:900;text-transform:uppercase;line-height:.8;white-space:nowrap;--fs:calc((100vw - 2 * var(--mar)) / 2.7);font-size:var(--fs)}
.big span{display:block}
.big .l1{font-stretch:76%}
.big .l2{font-stretch:50%;margin-top:.02em}
@media (min-width:700px){
  .big{--fs:min(calc((100vw - 2 * var(--mar)) / 5.23), calc((100svh - 300px) / 1.64))}
  .big .l1{font-stretch:150%}
  .big .l2{font-stretch:99%}
}
.foot{display:grid;grid-template-columns:1fr;gap:20px;margin-top:clamp(24px,3vw,40px);padding-top:14px;border-top:1px solid var(--line);align-items:end}
.n404{font:900 clamp(3.4rem,9vw,8rem)/.8 var(--f-disp);font-stretch:150%;margin:0}
.txt{margin:0;max-width:34em;font-size:.82rem;line-height:1.5}
.back{display:inline-flex;align-items:center;justify-content:space-between;gap:24px;min-height:48px;padding:14px 18px;background:var(--screen);color:var(--night);font:750 .95rem/1 var(--f-disp);font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;transition:background-color 320ms var(--cut),color 320ms var(--cut)}
.back span{transition:transform 320ms var(--ease)}
.back:hover{background:transparent;color:var(--screen);box-shadow:inset 0 0 0 1px var(--screen)}
.back:hover span{transform:translateX(6px)}
@media (min-width:700px){
  .foot{grid-template-columns:auto 1fr auto;gap:clamp(20px,3vw,48px)}
}
@media (max-width:699px){.back{width:100%}}
@media (prefers-reduced-motion:reduce){.back,.back span{transition:none}}
</style>
</head>
<body>
<header class="hd">
  <a class="logo" href="/" aria-label="Arturo, inicio">Arturo</a>
  <a class="nav" href="/#trabajo">Trabajo</a>
</header>
<div class="bar meta" aria-hidden="true"><span>Error 404 · Plano no encontrado</span><span class="tc">TC 00:00:04:04</span></div>
<main>
  <h1 class="big"><span class="l1">Fuera</span><span class="l2">de plano</span></h1>
  <div class="foot">
    <p class="n404" aria-hidden="true">404</p>
    <p class="txt meta">Esta página se ha quedado fuera del encuadre: puede que la dirección haya cambiado o que nunca existiera. El trabajo sigue en la sala.</p>
    <a class="back" href="/">Volver a la sala <span aria-hidden="true">→</span></a>
  </div>
</main>
</body>
</html>
